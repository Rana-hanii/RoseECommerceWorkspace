<section class="w-full">
    <button
  type="button"
  (click)="useCurrentLocation()">
  Use Current Location
</button>

<google-map
  width="100%"
  height="400px"
  [center]="center()"
  [zoom]="zoom"
  (mapClick)="onMapClick($event)">

  @if(markerPosition()) {
    <map-marker
      [position]="markerPosition()!">
    </map-marker>
  }

</google-map>
</section>
