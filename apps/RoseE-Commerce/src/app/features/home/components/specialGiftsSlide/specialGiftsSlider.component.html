<div class="relative rounded-3xl overflow-hidden">
  <p-carousel
    [value]="SpecialGiftsSlider"
    [numVisible]="1"
    [numScroll]="1"
    [circular]="true"
    [autoplayInterval]="3500"
    [showNavigators]="true"
    [showIndicators]="true"
    [responsiveOptions]="responsiveOptions"
    class="custom-carousel"
  >
    <ng-template pTemplate="item" let-item>
      <div class="relative w-full h-[380px] md:h-[430px] rounded-3xl overflow-hidden">

        <!-- Image -->
        <img
          ngOptimizedImage
          [src]="item.images"
          [alt]="item.title"
          class="w-full h-full object-cover"
        />

        <!-- Overlay -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/60 to-black/10 flex items-center px-10 md:px-16">

          <div class="text-white max-w-lg space-y-4">

            <h1 class="text-3xl md:text-4xl font-semibold leading-snug">
              {{ item.title }}
            </h1>

            <p class="text-white/80 text-base md:text-lg leading-relaxed">
              {{ item.desc }}
            </p>

            <button class="px-6 py-3 bg-[#efb9b9] text-black font-semibold rounded-xl hover:bg-[#e9a3a3] transition">
              {{ item.buying }}
            </button>

          </div>

        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>
