<section>
  <div class="parent container mx-auto flex justify-center items-center gap-6">

    @for (item of items; track item.id) {
    <div class="SpecialGifts relative w-[410px] h-[270px] rounded-2xl overflow-hidden">

      <!-- Image -->
      <img
        ngOptimizedImage
        [src]="item.images"
        [alt]="item.title"
        class="w-full h-full object-cover rounded-2xl"
      />

      <!-- Overlay Text -->
      <div class="absolute bottom-5 left-5 space-y-2">

        <span class="text-[#A6252A] bg-[#FBEAEA] px-3 py-1 rounded-2xl text-sm">
          {{ item.desc }}
        </span>

        <h2 class="text-white text-xl font-semibold drop-shadow-md leading-snug">
          {{ item.title }}
        </h2>

      </div>

    </div>
    }

  </div>
</section>
