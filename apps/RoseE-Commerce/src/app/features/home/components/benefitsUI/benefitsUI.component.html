<section class="flex flex-col xl:flex-row items-center justify-evenly xl:justify-center w-full gap-4  hover:scale-[1.2]  duration-[0.6s]  ">
    <!-- logo with background -->
    <div class="flex flex-col items-center justify-center">
           <div class="bg-[var(--color-primary)] dark:bg-[var(--dark-text-secondary)] w-[60px] h-[60px] rounded-full flex items-center justify-center  p-4">
                <i class="pi {{icon}} text-white dark:text-black  " style="font-size: 34px" ></i>
            </div>
    </div>
    <!-- titles -->
     <div class="flex flex-col items-center xl:items-start justify-center xl:justify-end ">
        <h1 class="text-2xl text-[var(--color-primary)] dark:text-[var(--dark-text-secondary)] font-[600]">{{title}}</h1>
        <p class="text-sm text-[var(--color-text-gray)] dark:text-[var(--dark-text-gray)]">{{description}}</p>
     </div>
</section>
