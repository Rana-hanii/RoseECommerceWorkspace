<section class="container lg:px-20 mx-auto py-16">
    <div class="w-full flex flex-col justify-start items-start">

        <!-- title -->
        <div class="w-1/4 my-8">
            <h1 class="text-5xl font-[700] capitalize">update profile</h1>
        </div>


        <!-- Side Bar and update user Form  -->
         <div class="w-full flex flex-row justify-center items-center mt-9">

            <!-- sidebar -->
             <div class="bg-[#FAFAFA] w-1/4 h-[700px] flex flex-col items-center justify-between rounded-2xl py-5">
                <!-- buttons -->
                 <div class="w-full flex flex-col justify-start items-center px-4  gap-y-3">

                    <button 
                        (click)="isActive = 'account'"
                        [class.bg-[#27272A]]="isActive === 'account'"
                        [class.text-white]="isActive === 'account'"
                        [class.text-black]="isActive !== 'account'"
                    
                     class="w-full px-4 py-2  flex items-center justify-start active:bg-[#27272A]
                              active:text-white rounded-xl cursor-pointer ">
                              
                        <i class="pi pi-user-edit " style="font-size: 24px;"></i>
                        <span class="capitalize text-xl font-[600]  px-3 py-1  ">
                              my account
                        </span>
                    </button>
                    <button
                        (click)="isActive = 'password'"
                        [class.bg-[#27272A]]="isActive === 'password'"
                        [class.text-white]="isActive === 'password'"
                        [class.text-black]="isActive !== 'password'"
                    
                        class="w-full px-4 py-2  flex items-center justify-start active:bg-[#27272A]
                              active:text-white rounded-xl cursor-pointer  ">
                              
                        <i class="pi pi-lock " style="font-size: 24px;"></i>
                        <span class="capitalize text-xl font-[600]  px-3 py-1  ">
                             change password
                        </span>
                    </button>
                    
                   
                 </div>
                 <div class="justify-end items-center w-3/4">
                    <button class="capitalize text-lg text-[#CD2E33] active:bg-[#F4F4F5] cursor-pointer">
                        <i class="pi pi-sign-out "></i>
                        logout
                    </button>
                  
                 </div>
             </div>


             <!-- user Form -->
              <div class="w-3/4 h-[700px]  flex flex-col items-start justify-start px-8">
               <!-- if user want to change info about him -->
                 @if (isActive === 'account') {
                               <!-- change user photo -->
                            <div class="w-full flex gap-x-3 py-3 ">
                                <!-- photo -->
                                <div class="flex items-center justify-end relative w-1/6 px-4">
                                    <img [src]="userPhoto" alt="user-photo" class="bg-black w-[120px] h-[120px] object-cover rounded-full">
                                <!-- upload button -->
                                    <div class="absolute right-[1px] -bottom-[7px] flex justify-center items-center">
                                        <label class="bg-[#F4F4F5] w-[44px] h-[44px] rounded-full cursor-pointer flex items-center justify-center">
                                        <i class="pi pi-cloud-upload" style="font-size: x-large;"></i>
                                        <input type="file" accept="image/*" (change)="onSelectFile($event)" class="hidden">
                                        </label>
                                    </div>
                                </div>

                                <div class="w-5/6 flex flex-col justify-center items-start">
                                    <h1 class="capitalize text-lg font-[600] text-black">
                                        uplaod photo
                                    </h1>
                                    <p class="text-lg text-[#71717A] ">
                                        You can upload a .jpg, .png, or .gif photo with max size of 5MB.
                                    </p>
                                </div>

                            </div>

                    <div class=" w-full py-3 px-2">
                        <form [formGroup]="updateUserForm" (ngSubmit)="editProfile()"
                                class="w-full flex flex-col items-start justify-evenly">

                           <div class="flex flex-row justify-between items-center w-full ">
                                <app-reusable-input
                                type="text"
                                label="First name"
                                placeholder="Jonas"
                                formControlName="firstName"
                                customClass="w-100"
                                >
                                </app-reusable-input>
                                <app-reusable-input
                                type="text"
                                label="Last name"
                                placeholder="Schweitzer"
                                formControlName="lastName"
                                customClass="w-100"
                                >
                                </app-reusable-input>

                           </div>
                           
                           <div class="w-full">
                                <app-reusable-input
                                    type="email"
                                    label="Email"
                                    placeholder="email@123.com"
                                    formControlName="email"
                                    
                                    >
                                </app-reusable-input>
                                <app-reusable-input
                                    type="tel"
                                    label="phone"
                                    placeholder="Enter Valid Number"
                                    customClass=""
                                    formControlName="phone"
                                    >
                                </app-reusable-input>
                           
                           </div>


                           <div class="flex flex-row justify-between items-center w-full my-11 ">

                            <a class="text-2xl text-red-600 capitalize cursor-pointer"> delete My Account</a>

                            <button type="submit" class="bg-primary text-white py-3 px-9 cursor-pointer capitalize rounded-2xl">Save Changes</button>

                           </div>

                        </form>
                    </div>
                 
                 }
                  <!-- if user want to change His Password -->
                 @if (isActive ==='password') {

                    <form class="w-full" [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">

                         <div class="w-full flex flex-col gap-x-3 py-3">
                        <div class="w-full">
                            <app-reusable-input
                            type="password"
                            label="Old Password"
                            placeholder="password@1234"
                            formControlName="password"
                            >
                            </app-reusable-input>
                        </div>
                        <div class="w-full">
                            <app-reusable-input
                            type="password"
                            label="New Password"
                            placeholder="password@1234"
                            formControlName="newPassword"
                            >
                            </app-reusable-input>
                        </div> 

                        <div class="flex flex-row justify-end items-center w-full my-11 ">

                            <button type="submit" class="bg-primary text-white py-3 px-9 cursor-pointer capitalize rounded-2xl">Change Password</button>

                        </div>


                    </div>

                    </form>
                    
                 }
              
              </div>
            
         </div>
    </div>
</section>
