<section class="container px-2 lg:px-20 mx-auto py-7 lg:py-16">
    <div class="w-full flex flex-col justify-start items-start">

        <!-- title -->
        <div class="w-full lg:w-1/4 my-2 lg:my-8">
            <h1 class=" text-4xl lg:text-5xl font-[700] capitalize">update profile</h1>
        </div>


        <!-- Side Bar and update user Form  -->
         <div class="w-full flex flex-col lg:flex-row justify-center items-center mt-9">

            <!-- sidebar -->
             <div class="bg-[#FAFAFA] hidden  lg:w-1/4 h-[700px] lg:flex flex-col items-center justify-between rounded-2xl py-5">
                <!-- buttons -->
                 <div class="w-full flex flex-col justify-start items-center px-4  gap-y-3">

                    <button 
                        (click)="isActive = 'account'"
                        [class.bg-[#27272A]]="isActive === 'account'"
                        [class.text-white]="isActive === 'account'"
                        [class.text-black]="isActive !== 'account'"
                    
                     class="w-full px-4 py-2  flex items-center justify-start active:bg-[#27272A]
                              active:text-white rounded-xl cursor-pointer ">
                              
                        <i class="pi pi-user-edit " style="font-size: 24px;"></i>
                        <span class="capitalize text-xl font-[600]  px-3 py-1  ">
                              my account
                        </span>
                    </button>
                    <button
                        (click)="isActive = 'password'"
                        [class.bg-[#27272A]]="isActive === 'password'"
                        [class.text-white]="isActive === 'password'"
                        [class.text-black]="isActive !== 'password'"
                    
                        class="w-full px-4 py-2  flex items-center justify-start active:bg-[#27272A]
                              active:text-white rounded-xl cursor-pointer  ">
                              
                        <i class="pi pi-lock " style="font-size: 24px;"></i>
                        <span class="capitalize text-xl font-[600]  px-3 py-1  ">
                             change password
                        </span>
                    </button>
                    
                   
                 </div>
                 <div class="justify-end items-center w-3/4">
                    <button class="capitalize text-lg text-[#CD2E33] active:bg-[#F4F4F5] cursor-pointer">
                        <i class="pi pi-sign-out "></i>
                        logout
                    </button>
                  
                 </div>
             </div>
             

            <!-- side bar button in mobile view -->
            <div class="w-full pr-5 flex justify-end items-center gap-3 lg:hidden dark:hover:text-[#f4698a] py-3 mt-3 mb-3">
                 <button (click)="visible = true"  class="text-xl font-[600] text-[var(--color-text-maroon)] dark:text-[var(--dark-text-secondary)]
                  hover:text-[var(--color-primary)] dark:hover:text-[#f4698a]">User Settings <i class="pi pi-cog
                   bg-[var(--color-secondary)] text-[var(--color-text-maroon)]
                     hover:bg-[var(--color-text-maroon)] hover:text-[var(--color-secondary)] dark:hover:bg-[#f4698a] "></i></button>
             </div>
             <!-- side bar when mobile view -->
 
            <div class=" w-full  lg:hidden ">
                    
                <p-drawer #drawerRef [(visible)]="visible" >
                    <ng-template #headless>
                        <div class="flex flex-col !min-vh-100 overflow-y-scroll  bg-[#FAFAFA] dark:bg-[#27272A]">

                            <div class="flex justify-end items-center p-3">
                                <p-button type="button" (click)="closeCallback($event)" icon="pi pi-times" 
                                rounded="true"  styleClass="h-8 w-8  !bg-[var(--color-secondary)] hover:!bg-[#FFC2D0] 
                                !text-[var(--color-text-maroon)] !border-0 "  ></p-button>
                            </div>
                            


                            <div class="w-full flex flex-col justify-between h-[700px] items-start py-12">

                                <div class="w-full flex flex-col justify-start items-center px-4  gap-y-3">

                                        <button 
                                            (click)="isActive = 'account'"
                                            (click)="closeCallback($event)"
                                            [class.bg-[#27272A]]="isActive === 'account'"
                                            [class.text-white]="isActive === 'account'"
                                            [class.text-black]="isActive !== 'account'"
                                        
                                        class="w-full px-4 py-2  flex items-center justify-start active:bg-[#27272A]
                                                active:text-white rounded-xl cursor-pointer ">
                                                
                                            <i class="pi pi-user-edit " style="font-size: 24px;"></i>
                                            <span class="capitalize text-xl font-[600]  px-3 py-1  ">
                                                my account
                                            </span>
                                        </button>
                                        <button
                                            (click)="isActive = 'password'"
                                            (click)="closeCallback($event)"
                                            [class.bg-[#27272A]]="isActive === 'password'"
                                            [class.text-white]="isActive === 'password'"
                                            [class.text-black]="isActive !== 'password'"
                                        
                                            class="w-full px-4 py-2  flex items-center justify-start active:bg-[#27272A]
                                                active:text-white rounded-xl cursor-pointer  ">
                                                
                                            <i class="pi pi-lock " style="font-size: 24px;"></i>
                                            <span class="capitalize text-xl font-[600]  px-3 py-1  ">
                                                change password
                                            </span>
                                        </button>
                    
                   
                                </div>

                                <div class=" px-4 flex justify-start items-center full">
                                    <button class="capitalize text-lg text-[#CD2E33] active:bg-[#F4F4F5] cursor-pointer">
                                        <i class="pi pi-sign-out "></i>
                                        logout
                                    </button>
                                
                                </div>

                                
                            
                            </div>

                        
                        </div>
                    </ng-template>
                </p-drawer>
            </div>

             <!-- user Form -->
              <div class="w-full lg:w-3/4 h-[700px]  flex flex-col items-start justify-start px-8">
               <!-- if user want to change info about him -->
                 @if (isActive === 'account') {
                               <!-- change user photo -->
                            <div class="w-full flex gap-x-3 py-3 ">
                                <!-- photo -->
                                <div class="flex items-center justify-between relative w-1/3 lg:w-1/6 px-4">
                                    <img [src]="userPhoto" alt="user-photo" class="bg-black w-[88px] h-[88px] lg:w-[120px] lg:h-[120px] object-cover rounded-full">
                                <!-- upload button -->
                                    <div class="absolute right-[1px] -bottom-[7px] flex justify-center items-center">
                                        <label class="bg-[#F4F4F5] w-[38px] h-[38px] lg:w-[44px] lg:h-[44px] rounded-full cursor-pointer flex items-center justify-center">
                                        <i class="pi pi-cloud-upload" style="font-size: x-large;"></i>
                                        <input type="file" accept="image/*" (change)="onSelectFile($event)" class="hidden">
                                        </label>
                                    </div>
                                </div>

                                <div class="w-2/3 lg:w-5/6 flex flex-col justify-center items-start">
                                    <h1 class="capitalize text-lg font-[600] text-black">
                                        uplaod photo
                                    </h1>
                                    <p class="text-lg text-[#71717A] ">
                                        You can upload a .jpg, .png, or .gif photo with max size of 5MB.
                                    </p>
                                </div>

                            </div>

                            <!-- user Info inputs -->
                    <div class=" w-full py-3 px-2">
                        <form [formGroup]="updateUserForm" (ngSubmit)="editProfile()"
                                class="w-full flex flex-col items-start justify-evenly">

                           <div class="flex flex-row justify-between items-center w-full space-x-3 lg:space-x-0 ">
                                <app-reusable-input
                                type="text"
                                label="First name"
                                placeholder="Jonas"
                                formControlName="firstName"
                                customClass="lg:w-100"
                                >
                                </app-reusable-input>
                                <app-reusable-input
                                type="text"
                                label="Last name"
                                placeholder="Schweitzer"
                                formControlName="lastName"
                                customClass="lg:w-100"
                                >
                                </app-reusable-input>

                           </div>
                           
                           <div class="w-full">
                                <app-reusable-input
                                    type="email"
                                    label="Email"
                                    placeholder="email@123.com"
                                    formControlName="email"
                                    
                                    >
                                </app-reusable-input>
                                <app-reusable-input
                                    type="tel"
                                    label="phone"
                                    placeholder="Enter Valid Number"
                                    customClass=""
                                    formControlName="phone"
                                    >
                                </app-reusable-input>
                           
                           </div>


                           <div class="flex flex-row justify-between items-center w-full my-11 ">

                            <a class="text-lg lg:text-2xl text-red-600 capitalize cursor-pointer">delete My Account</a>

                            <button type="submit" class="bg-primary text-white py-2 lg:py-3 px-4 lg:px-9 cursor-pointer capitalize rounded-2xl">Save Changes</button>

                           </div>

                        </form>
                    </div>
                 
                 }
                  <!-- if user want to change His Password -->
                 @if (isActive ==='password') {

                    <form class="w-full" [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">

                         <div class="w-full flex flex-col gap-x-3 py-3">
                        <div class="w-full">
                            <app-reusable-input
                            type="password"
                            label="Old Password"
                            placeholder="password@1234"
                            formControlName="password"
                            >
                            </app-reusable-input>
                        </div>
                        <div class="w-full">
                            <app-reusable-input
                            type="password"
                            label="New Password"
                            placeholder="password@1234"
                            formControlName="newPassword"
                            >
                            </app-reusable-input>
                        </div> 

                        <div class="flex flex-row justify-end items-center w-full my-11 ">

                            <button type="submit" class="bg-primary text-white py-2 lg:py-3 px-4 lg:px-9 cursor-pointer capitalize rounded-2xl">Change Password</button>

                        </div>


                    </div>

                    </form>
                    
                 }
              
              </div>
            
         </div>
    </div>
</section>
