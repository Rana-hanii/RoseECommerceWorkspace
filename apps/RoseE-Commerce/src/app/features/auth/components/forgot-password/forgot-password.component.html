<main>
  <app-auth-title [text]="'Forgot Password?'"></app-auth-title>
  <p>Worry not, we’ll send you instructions to help you reset it.</p>
  @if(step === 1){
  <form [formGroup]="forgetPassword" (ngSubmit)="submitForgetPassword()">
    <app-reusable-input
      label="Email"
      placeholder="user@example.com"
      type="email"
      customClass="w-full"
      formControlName="email"
    >
    </app-reusable-input>
    <app-custom-button
      pageType="Continue"
      (buttonClick)="submitForgetPassword()"
    ></app-custom-button>
  </form>
  } @if (step === 2) {
  <form [formGroup]="otpForm" (ngSubmit)="submitVerifyCode()">
    <div class="card flex justify-center my-5">
      <p-inputotp formControlName="otp" [length]="6" />
    </div>
  </form>
  <app-custom-button
    pageType="Verify OTP"
    (buttonClick)="submitVerifyCode()"
  ></app-custom-button>
  } @if (step === 3) {
  <form [formGroup]="resetPasswordForm" (ngSubmit)="submitResetPassword()">
    <!-- <app-reusable-input
      label="Email"
      placeholder="Enter Your Email"
      type="email"
      customClass="w-full"
      formControlName="email"
    ></app-reusable-input> -->
    <app-reusable-input
      label="Password"
      placeholder="Enter New Password"
      type="password"
      customClass="w-full"
      formControlName="newPassword" 
    ></app-reusable-input>
    <app-custom-button
      pageType="Reset Password"
      (buttonClick)="submitResetPassword()"
    ></app-custom-button>
  </form>
  }
  <div class="line"></div>

  <div class="mt-5 flex justify-center">
    <p>Don’t have an account yet?</p>
    <a class="cursor-pointer CreateAccount" routerLink="/auth/register"
      >Create one now!</a
    >
  </div>
</main>
