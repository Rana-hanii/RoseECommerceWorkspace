<section >
    <div class="w-full h-[277px]  flex flex-col justify-start items-start gap-y-3 pr-6 py-8 ">
        <!-- title section and reset button -->
         <div class="flex flex-row w-full justify-between items-center ">
            <h1 class="justify-start font-[600] text-xl">Occasions</h1>
            <button class="text-[var(--color-primary)] justify-end  items-center inline-flex cursor-pointer font-[500]
                        hover:scale-[1.2] duration-[1s] mr-3 hover:bg-[var(--color-secondary)] hover:rounded-xl hover:px-2"
                (click)="reset()">

                <svg width="22" height="22" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.25 3.75L3.75 11.25M3.75 3.75L11.25 11.25" stroke="#DC2626" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                Reset</button>
                
         </div>
         
         <!-- loop on occasions -->
          <div class="grid grid-cols-2 max-h-[250px] gap-2 ">
                  @for (item of allOccasions$ |async; track item._id) {
               
                    <div class=" relative rounded-2xl cursor-pointer" (keydown.enter)="selectOccasions(item._id)" 
                    tabindex="0" role="button" (click)="selectOccasions(item._id)"
                     [ngClass]="selectedId === item._id ? 'shade' : 'bg-transparent'">

                        <img [src]="'https://flower.elevateegy.com/uploads/'+item.image"  alt="occasion-photo" 
                              class="object-cover rounded-xl w-[193px] h-[88px]  cursor-pointer "  >

                        <div class=" absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2  ">
                            <h1 class="text-white text-center text-nowrap text-lg font-[600] ">{{item.name}}</h1>
                        </div>
                    </div> 
                   
               
            }
          </div>
          
            
    </div>
</section>
