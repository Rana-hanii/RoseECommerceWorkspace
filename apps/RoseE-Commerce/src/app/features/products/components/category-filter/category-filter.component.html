<section >
    <div class="w-full  h-[277px]  flex flex-col justify-start items-start gap-y-3 ">
        <!-- title section and reset button -->
         <div class="flex flex-row w-full justify-between items-center px-2 lg:px-0">
            <h1 class="justify-start font-[600] text-xl">Category</h1>
            <app-reset-button
            [buttonName]="'Reset'"
            (click)="reset()"
            ></app-reset-button>
                
         </div>
         
         <!-- loop on Categories -->
        <div class="overflow-y-scroll flex flex-col justify-start items-start gap-y-2 mt-2">
            @for (item of allCategories$ |async; track item._id) {
                
             <div tabindex="0" role="button" (keydown.enter)="selectCategory(item._id)" 
             class="w-[320px] flex flex-row justify-center items-center cursor-pointer lg:pr-3 px-2 lg:px-0"
               (click)="selectCategory(item._id)" >

                <!-- logo -->
            <div class="w-1/6 flex items-center justify-center rounded-l-md transition-colors "
            [ngClass]=" selectedId().includes(item._id) ? 'bg-[var(--color-primary)]' : 'bg-[#71717A]'" >
                <img [src]="item.image" class="object-contain w-[30px] h-[35px] p-1 filter  brightness-0 invert" alt="category-logo">
            </div>

            <!-- title -->
            <div class="w-5/6 flex items-center justify-start  rounded-r-md h-[35px] transition-colors "
                [ngClass]=" selectedId().includes(item._id) ? 'bg-[#FBEAEA]' : 'bg-[#E4E4E7]'">
                <a><span class="ml-4 text-xl uppercase" >{{item.name}}</span></a>
            </div>
        </div>
            }
        </div>
            
    </div>
</section>
