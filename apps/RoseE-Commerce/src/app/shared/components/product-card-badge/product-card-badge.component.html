       <p class="rounded-3xl  min-w-[42px] min-h-[16px] flex justify-center items-center px-2 text-sm uppercase font-[500] "
          [class]=" type === 'hot' ? 'bg-[var(--color-secondary)] text-[var(--color-primary)]' :
                    type === 'out of stock' ? 'bg-[#DC2626] text-white' :
                    type === 'new' ? 'bg-[#F4F4F5] text-[#3F3F46]' : '' "
         >{{type}}</p>
