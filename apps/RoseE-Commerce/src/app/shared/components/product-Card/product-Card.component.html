<section class=" flex items-center justify-center my-5 ">

    <!-- Card -->
    <div class="flex flex-col justify-center items-center p-2 md:p-0 h-[280px] w-[250px] md:h-[364px] md:w-[302px] ">

        <!-- image -->
        <div class="relative group">

            <img [src]="image" [alt]="alt" class=" w-[240px] md:w-[302px] h-[192px] md:h-[272px] object-cover rounded-2xl " >
            
            <!-- badge details -->
            <div class="absolute top-3 right-3 z-20 flex flex-col items-end gap-2 ">
                @for (badge of badges; track $index) {
                    <app-product-card-badge 
                    [type]="badge">
                    </app-product-card-badge>
                }
               
            </div>
            <!-- wishlist button  -->
            @if (wishlistBtn) {
                   <div class="absolute top-3 left-3 z-20 flex gap-2 ">

               <button class="wishlist-btn" [class.active]="isWishlisted" (click)="toggleWishlist()" >
                    @if(!isWishlisted){
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10.125 14.625L9 15.75L3.75 10.5C2.625 9.4125 1.5 8.1 1.5 6.375C1.5 5.28098 1.9346 4.23177 2.70818 3.45818C3.48177 2.6846 4.53098 2.25 5.625 2.25C6.945 2.25 7.875 2.625 9 3.75C10.125 2.625 11.055 2.25 12.375 2.25C12.9798 2.2507 13.5771 2.38439 14.1245 2.64162C14.6719 2.89884 15.1561 3.2733 15.5427 3.73846C15.9293 4.20363 16.2088 4.74811 16.3616 5.33335C16.5143 5.91858 16.5365 6.53024 16.4265 7.125M11.25 11.25H15.75M13.5 9V13.5"
                         stroke="#A6252A" stroke-width="1.45833" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>

                        <span>Add to wishlist</span>
                    }@else {
                            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11.157 14.2429L10.131 15.2351C9.99125 15.3957 9.81895 15.5246 9.62554 15.6134C9.43212 15.7022 9.22203 15.7488 9.00922 15.7501C8.7964 15.7515 8.58574 15.7075 8.39122 15.6212C8.19669 15.5349 8.02277 15.4081 7.881 15.2494L3.75 11.2504C2.625 10.1254 1.5 8.8504 1.5 7.1254C1.50002 6.2908 1.7532 5.47583 2.2261 4.78814C2.699 4.10045 3.36939 3.57239 4.14871 3.2737C4.92803 2.975 5.77962 2.91973 6.59101 3.11518C7.4024 3.31063 8.13542 3.74761 8.69325 4.3684C8.73254 4.41041 8.78004 4.4439 8.83281 4.4668C8.88557 4.48969 8.94248 4.50151 9 4.50151C9.05752 4.50151 9.11443 4.48969 9.16719 4.4668C9.21996 4.4439 9.26746 4.41041 9.30675 4.3684C9.86283 3.74357 10.596 3.30292 11.4087 3.1051C12.2214 2.90727 13.0751 2.96166 13.8562 3.26101C14.6372 3.56036 15.3085 4.09049 15.7808 4.78082C16.2531 5.47116 16.504 6.28897 16.5 7.1254C16.4998 7.52546 16.4381 7.92311 16.317 8.3044M11.25 11.2504H15.75"
                             stroke="#F4F4F5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span>Remove from wishlist</span>
                    }
                </button> 
            
            </div>
            }
            

                <!-- hover Layer -->
             <div  class="absolute inset-0 bg-[#E6507380] opacity-0 rounded-2xl group-hover:opacity-90
              transition-opacity duration-300 flex items-center justify-center gap-2 " >
                <!-- <button  class="h-[35px] w-[35px] cursor-pointer rounded-full bg-white flex items-center justify-center">
                        <i class="pi pi-heart text-[var(--color-primary)] !text-xl"></i>
                        </button> -->
                <button  [routerLink]="['/main/productDetails', id]"
                         class="h-[35px] w-[35px] cursor-pointer rounded-full bg-white flex items-center justify-center">
                        <i class="pi pi-eye text-[var(--color-primary)] !text-xl"></i>
                        </button>
                        
            </div>
        </div>
        
        <!-- card content -->
        <div class="flex flex-col justify-between items-start h-full w-full ">

            <!-- title -->
             <div class=" mt-5 ">
                <h1 class="text-[var(--color-text-maroon)] dark:text-[var(--dark-text-secondary)] text-md lg:text-xl font-[600] line-clamp-1">{{title}}</h1>
             </div>

             <!-- description -->
             <div class="flex flex-row justify-between items-end lg:items-center w-full mt-4">

                <!-- rating-Price  -->
                <div class="w-3/4 flex flex-col justify-center items-start ">

                    <div class="card flex justify-start mb-2">
                        <p-rating [(ngModel)]="value" [readonly]="true" />
                    </div>
                    <div>
                        <p class="text-md lg:text-xl font-semibold text-[var(--color-text-maroon)] dark:text-[var(--dark-text-secondary)]
                                    gap-x-2 flex flex-wrap-reverse lg:flex-nowrap ">{{price| currency:'EGP' }} 
                            <span class="line-through font-light text-gray-400">{{priceBefore |currency:'EGP'}}</span></p>
                    </div>
                </div>

                <!-- button -->
                <div class="w-1/4 flex justify-end items-end">
                
                      <button (click)="addToCart()" class="h-[42px] w-[42px] rounded-full bg-[#A6252A] dark:bg-[#CD2E33] flex items-center justify-center">
                            <i class="pi pi-shopping-cart cursor-pointer text-white !text-2xl"></i>
                        </button>
                  
                    
                </div>
             </div>
        </div>

       
    </div> 

</section>
