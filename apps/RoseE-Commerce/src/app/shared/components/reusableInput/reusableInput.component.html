<div class="">
  <div
    [ngClass]="customClass"
    class="w-full flex flex-col items-start justify-center gap-1 my-0 dark:text-white"
    
  >
    <label for="{{ label }}"
      ><strong>{{ label }}</strong></label
    >

    @if (type !== 'select') {

    <div class="w-full relative ">
      @if (type!== 'tel') {
      <input
        class="form-input relative dark:bg-[#3F3F46] dark:text-white dark:focus:bg-[#3F3F46]"
        id="{{ label }}"
        [type]="
          type === 'password' ? (showPassword ? 'text' : 'password') : type 
         
        "
   
        placeholder="{{ placeholder }}"
        value="{{ value }}"
        [formControl]="control"
        [class]="
          control.touched
            ? control.invalid
              ? 'valid-input'
              : 'invalid-input'
            : null
        "
      />

      } @if (type === 'password') {
      <button
        type="button"
        class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700 dark:focus:bg-[#3F3F46]"
        (click)="togglePasswordEye()"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        <i
          class="cursor-pointer pi"
          [class]="showPassword ? 'pi-eye-slash' : 'pi-eye'"
        ></i>
      </button>
      } @if (type ==='rePassword' ) {
      <button
        type="button"
        class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-700"
        (click)="togglePasswordEye()"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        <i
          class="cursor-pointer pi"
          [class]="showPassword ? 'pi-eye-slash' : 'pi-eye'"
        ></i>
      </button>
      } @if(type === 'tel'){

      <ngx-intl-tel-input
        [cssClass]="'form-input'"
        [preferredCountries]="['eg']"
        [enableAutoCountrySelect]="true"
        [enablePlaceholder]="true"
        [searchCountryFlag]="true"
        [selectFirstCountry]="true"
        [formControl]="control"
        [separateDialCode]="true"
        [phoneValidation]="true"
        type="tel"
      ></ngx-intl-tel-input>

      }
    </div>

    } @if (type === 'select') {

    <div class="form-input !py-1">
      <p-select
        [options]="options"
        [placeholder]="placeholder"
        [formControl]="control"
        styleClass=" w-full !border-0 no-prime-style dark:!bg-[#3F3F46] dark:!text-white"
        panelStyleClass="dark:!text-red-500"
      />
    </div>
    }

    <div class="mb-3">
      <app-error-msg
        [control]="control"
        [label]="label"
        [type]="type"
      ></app-error-msg>
    </div>
  </div>
</div>
