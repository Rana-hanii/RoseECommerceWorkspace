<h2 class="font-semibold text-2xl">Account Settings</h2>

<section class="w-full min-h-screen p-4 bg-[#FAFAFA]">
  <div class="container text-xl bg-white rounded-lg p-5">
    <div class="flex justify-start items-center gap-3">
      <div>
        <img class="w-24 rounded-full" [src]="photoUser" alt="" />
      </div>

      <div>
        <h3 class="font-semibold text-xl">Upload Photo</h3>
        <p class="text-base font-normal text-[#71717A]">
          You can upload a .jpg, .png, or .gif photo with max size of 5MB.
        </p>
      </div>
    </div>

    <div class="card flex flex-col justify-between mt-6">
      <form [formGroup]="profileForm" class="flex flex-col">
        <!-- First And Last Flex Roe -->
        <div class="lg:flex lg:flex-row sm:flex-col gap-6 w-full">
          <div class="flex flex-col gap-1 flex-1">
            <!-- first Name -->
            <div class="flex flex-col gap-1">
              <label class="font-medium text-sm" for="firstName"
                >First Name</label
              >
              <input
                formControlName="firstName"
                type="text"
                id="firstName"
                placeholder="Jonathan"
                name="firstName"
                class="form-input"
                required
              />
            </div>
          </div>
          <!-- Last Name -->
          <div class="flex flex-col gap-1 flex-1">
            <label class="font-medium text-sm" for="lastName">Last Name</label>
            <input
              type="text"
              id="lastName"
              placeholder="Adrian"
              name="lastName"
              formControlName="lastName"
              class="form-input"
              required
            />
          </div>
        </div>
        <!-- Email -->
        <div class="flex flex-col gap-1">
          <label class="font-medium text-sm" for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="jonathan@gmail.com"
            formControlName="email"
            required
            class="form-input"
            email
          />
        </div>

        <!-- phone -->
        <div class="flex flex-col gap-1 flex-1">
          <label class="font-medium text-sm" for="phone">Phone</label>
          <div class="w-full p-3">
            <ngx-intl-tel-input
              [cssClass]="'form-input'"
              [preferredCountries]="['eg']"
              [enableAutoCountrySelect]="true"
              [enablePlaceholder]="true"
              [searchCountryFlag]="true"
              [selectFirstCountry]="true"
              [separateDialCode]="true"
              [phoneValidation]="true"
              formControlName="phone"
              type="tel"
            ></ngx-intl-tel-input>
          </div>
        </div>
        <!-- Select Gender -->
        <div class="flex flex-col gap-1">
          <label class="font-medium text-sm" for="gender">Gender</label>
          <div class="card flex flex-col flex-1">
            <p-select
              formControlName="gender"
              [options]="genderOptions"
              optionLabel="label"
              optionValue="value"
              placeholder="Select Gender"
              class="w-full"
              [style]="{
                width: '100%',
                border: '1px solid #ddd',
                'border-radius': '8px'
              }"
            >
            </p-select>
          </div>
        </div>
        <!-- Option Delete Or Change -->
        <div
          class="flex flex-col lg:flex-row lg:items-center lg:justify-between p-5"
        >
          <!-- P DeLETE oR  Change -->
          <div class="flex gap-5">
            <button (click)="showDialog()">
              <h3 class="text-[#DC2626] text-base font-medium">
                Delete My Account
              </h3>
            </button>

            <a
              class="text-base font-medium text-[#27272A]"
              routerLink="/dash/changePassword"
            >
              Change Password
            </a>
          </div>
          <!-- Button -->
          <app-custom-button
            (buttonClick)="updateEditProfile()"
            pageType="Save Change"
          ></app-custom-button>
        </div>
      </form>
    </div>
  </div>
</section>

<div class="card flex flex-col justify-center items-center">
  <p-dialog
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '30rem' }"
    [header]="' '"
    [draggable]="false"
    [resizable]="false"
  >
    <div class="flex flex-col items-center text-center px-4">
      <div
        class="flex items-center justify-center w-32 h-32 rounded-full bg-gray-50 mb-6"
      >
        <div
          class="flex items-center justify-center w-20 h-20 rounded-full bg-gray-200"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-10 h-10 text-gray-600"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
      </div>

      <h2 class="font-bold text-2xl text-gray-800 mb-2">
        Are you sure you want to delete your account?
      </h2>
      <p class="text-[#DC2626] font-normal text-lg mb-10">
        This action is permanent and cannot be undone.
      </p>

      <div class="flex flex-row gap-4 w-full">
        <button
          (click)="visible = false"
          class="flex-1 py-3 px-4 border border-gray-300 rounded-xl text-gray-700 font-semibold hover:bg-gray-50 transition-colors"
        >
          Nope, not doing it
        </button>

        <button
          (click)="visible = false"
          (click)="deleteMyAccount()"
          class="flex-1 py-3 px-4 bg-[#DC2626] rounded-xl text-white font-semibold hover:bg-red-700 transition-colors"
        >
          Yes, delete
        </button>
      </div>
    </div>
  </p-dialog>
</div>
