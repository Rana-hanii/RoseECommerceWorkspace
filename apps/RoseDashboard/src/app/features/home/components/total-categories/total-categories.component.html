<div class="bg-white rounded-xl shadow-lg h-[326px] w-full p-3">
  <h3 class="font-semibold text-gray-800 mb-4 text-xl">All Categories</h3>
  <div class="max-h-[250px] overflow-y-auto space-y-3 pr-2 custom-scroll">
    @for (statistic of statistics; track statistic._id) {

    <div
      class="flex items-center justify-between border-b border-gray-200 pb-2"
    >
      <span class="text-gray-700">
        {{ statistic.name }}
      </span>

      <span
        class="bg-gray-100 text-gray-600 px-3 py-1 rounded-md text-sm font-medium"
      >
        {{ statistic.totalProducts }} products
      </span>
    </div>

    }
  </div>
</div>
