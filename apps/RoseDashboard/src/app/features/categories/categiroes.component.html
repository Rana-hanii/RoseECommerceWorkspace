<section class="w-full min-h-screen p-4 bg-[#FAFAFA]">
  <!-- here will put all system reports components -->
  <div class="card border-none shadow-sm rounded-lg overflow-hidden bg-white">
    <p-table
      [value]="category"
      [paginator]="true"
      [rows]="limit"
      [tableStyle]="{ 'min-width': '60rem' }"
      [rowsPerPageOptions]="[5, 10, 20]"
      [totalRecords]="20"
      styleClass="p-datatable-striped"
    >
      <ng-template #caption>
        <div class="flex flex-col gap-4 p-6">
          <div class="flex justify-between items-center p-2">
            <h2 class="text-2xl font-semibold">All Categories</h2>

            <button class="bg-[#A6252A] p-2 text-white rounded-lg">
              <i class="pi pi-plus text-sm"></i> <span>Add a new category</span>
            </button>
          </div>

          <div class="relative w-full">
            <i
              class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>
            <input
              type="text"
              pInputText
              placeholder="Search..."
              class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-1 focus:ring-gray-300 outline-none"
            />
          </div>
        </div>
      </ng-template>
      <ng-template #header>
        <tr class="border-b border-gray-100 p-3">
          <th style="width: 25%">Name</th>
          <th style="width: 25%">Product</th>
          <th style="width: 25%"></th>
          <th style="width: 25%"></th>
        </tr>
      </ng-template>
      <ng-template #body let-cat pTooltip="Category">
        <tr>
          <td>{{ cat.name }}</td>
          <td>{{ cat.productsCount }} products</td>
          <td>
            <button
              class="btn-light flex font-semibold text-xs bg-[#0063D01A] p-1 rounded-lg text-[#155DFC]"
            >
              <span
                ><svg
                  width="14"
                  height="14"
                  viewBox="0 0 14 14"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M8.75004 2.91671L11.0834 5.25004M12.3515 3.97371C12.66 3.66537 12.8333 3.24715 12.8333 2.81104C12.8334 2.37493 12.6602 1.95667 12.3518 1.64825C12.0435 1.33984 11.6253 1.16654 11.1892 1.16649C10.7531 1.16643 10.3348 1.33962 10.0264 1.64796L2.24121 9.43488C2.10577 9.56992 2.00561 9.73619 1.94954 9.91904L1.17896 12.4577C1.16388 12.5082 1.16275 12.5617 1.17566 12.6128C1.18858 12.6638 1.21508 12.7104 1.25234 12.7476C1.2896 12.7848 1.33624 12.8113 1.3873 12.8241C1.43837 12.8369 1.49195 12.8357 1.54238 12.8205L4.08163 12.0505C4.26431 11.995 4.43056 11.8954 4.56579 11.7606L12.3515 3.97371Z"
                    stroke="#155DFC"
                    stroke-width="1.252"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              edit
            </button>
          </td>
          <td>
            <button
              class="flex font-semibold text-[#DC2626] text-sm bg-[#FF00001A] p-1 rounded-lg"
            >
              <span
                ><svg
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M2 3.99999H14M12.6667 3.99999V13.3333C12.6667 14 12 14.6667 11.3333 14.6667H4.66667C4 14.6667 3.33333 14 3.33333 13.3333V3.99999M5.33333 3.99999V2.66666C5.33333 1.99999 6 1.33333 6.66667 1.33333H9.33333C10 1.33333 10.6667 1.99999 10.6667 2.66666V3.99999M6.66667 7.33333V11.3333M9.33333 7.33333V11.3333"
                    stroke="#DC2626"
                    stroke-width="1.25"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              Delete
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>
