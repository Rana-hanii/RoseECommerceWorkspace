<section class="w-full flex flex-col bg-white gap-3 p-5 rounded-xl shadow-lg">
  <form
    [formGroup]="categoryForm"
    (ngSubmit)="updateCategory()"
    class="flex flex-col gap-4"
  >
    <h2 class="text-2xl font-bold text-slate-800">
      Update Category: {{ category?.name }}
    </h2>

    <div class="flex flex-col gap-2">
      <label for="name" class="text-sm font-semibold text-black">
        Name <span class="text-[#A6252A]">*</span>
      </label>
      <div
        class="card flex justify-center border border-gray-300 p-1.5 rounded-lg w-full lg:w-[75%] focus-within:border-[#A6252A] transition-colors"
        [class.border-red-500]="
          categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched
        "
      >
        <input
          id="name"
          type="text"
          pInputText
          formControlName="name"
          class="w-full border-none focus:ring-0 outline-none"
        />
      </div>
      @if (categoryForm.get('name')?.invalid &&
      categoryForm.get('name')?.touched) {
      <small class="text-[#A6252A] text-xs italic"
        >Category name is required.</small
      >
      }
    </div>

    <div class="w-full lg:w-[75%] flex justify-start mt-1">
      <button
        type="button"
        class="border border-gray-400 p-2 px-4 cursor-pointer rounded-lg hover:bg-gray-50 flex items-center text-[#0063D0] text-sm font-medium transition-colors"
        (click)="toggleImage()"
      >
        <i
          [className]="showImage ? 'pi pi-eye-slash mr-2' : 'pi pi-image mr-2'"
        ></i>
        <span>{{ showImage ? 'Hide' : 'View' }} category image</span>
      </button>
    </div>

    @if (showImage && category?.image) {
    <div
      class="image-preview border-2 border-dashed border-gray-200 p-2 rounded-lg w-full flex justify-center self-end bg-gray-50"
    >
      <img
        [src]="category?.image"
        class="max-w-100 h-48 object-contain rounded-md shadow-sm"
        [alt]="category?.name"
      />
    </div>
    }

    <button
      type="submit"
      [disabled]="!categoryForm.touched || !categoryForm.dirty"
      class="bg-[#A6252A] text-white px-6 py-3 w-full lg:w-[75%] rounded-lg transition-all font-medium active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed mt-4"
    >
      Update Category
    </button>
  </form>
</section>
