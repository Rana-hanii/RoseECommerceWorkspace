<section class="w-full min-h-screen p-4 bg-[#FAFAFA]">
  <!-- here will put all system reports components -->
  <app-section-table
    [mainTitle]="'All Occasions'"
    [buttonIcon]="'pi-plus'"
    [buttonTitle]="'Add a Occasion'"
    [placeholder]="'Search Occasions .......'"
    [tableData]="occasions$ | async"
    [columns]="columns"
    [filterFields]="filterFields"
    (rowSelect)="onRowSelect($event)"
    [addRoute]="'/dash/occasions/addOccasion'"
    [editBaseRoute]="'/dash/occasions/updateOccasions'"
    [buttonRoute]="'/dash/occasions/addOccasion'"
    (deleteRow)="handelDelete($event)"
  ></app-section-table>
</section>
