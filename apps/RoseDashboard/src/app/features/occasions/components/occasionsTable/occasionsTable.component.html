<section class="w-full min-h-screen p-4 bg-[#FAFAFA]">

       <app-section-table
        [mainTitle]="'All Occasions'"
        [buttonIcon]="'pi-plus'"
        [buttonTitle]="'Add a Occasion'"

       ></app-section-table> 
      
        
</section>
