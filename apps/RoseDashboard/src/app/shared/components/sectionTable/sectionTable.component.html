<section class="container rounded-xl p-4 flex flex-col justify-center items-center bg-white">
   <!-- title and button -->
    <div class="w-full flex justify-between items-center">
        <!-- title -->
        <div>
            <h1 class="text-xl lg:text-2xl font-[600] text-[#27272A]  ">
            {{mainTitle()}}
            </h1>
        </div>
        <!-- button -->
         <app-button
         [icon]="buttonIcon()"
         [buttonName]="buttonTitle()"
         >
         </app-button>
    </div>

    <!-- Searchbar -->
     <!-- <div class="w-full mt-6">
        <app-search
        [value]="searchValue()"
        [placeholder]="placeholder()"
        (valueChange)="searchChange.emit($event)"
        ></app-search>
     </div> -->

     <!-- Table -->

     <div class="w-full mt-6">
        <app-table
        [value]="tableData() ?? []"
        [columns]="columns()"
        [placeholder]="placeholder()"
        [globalFilterFields]="filterFields()"
        (selection)="rowSelect.emit($event)"
        ></app-table>
     </div>
</section>
