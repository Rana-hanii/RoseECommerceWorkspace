<p-table
  #dt
  [value]="value() ?? []"
  [globalFilterFields]="globalFilterFields()"
  dataKey="id"
  selectionMode="single"
  [rows]="rows()"
  [paginator]="true"
  stateStorage="session"
  stateKey="reusable-table"
  [tableStyle]="{ 'min-width': '180px' }"
  (selectionChange)="selection.emit($event)" 
>
  <!-- Caption (Search) -->
  <ng-template #caption>
    <p-iconfield iconPosition="left">
      <input
         #searchInput
         pInputText
         class="!w-full !p-3 !border-[2px] !border-gray-400 !rounded-2xl  !px-6 !mb-6
            !text-lg !lg:text-xl !text-gray-500 focus:!ring-[var(--color-primary)] focus:!ring-3
            !focus:outline-0 !focus:border-1"
         type="text"
         [placeholder]="placeholder()"
        (input)="onGlobalSearch(searchInput.value)"
      />
    </p-iconfield>
  </ng-template>

  <!-- Header -->
  <ng-template #header>
    <tr class=" !text-lg lg:!text-2xl !font-[600] !bg-[#e5e4e4]   ">
      <th  *ngFor="let col of columns()" class="!max-w-[180px] !text-center" [pSortableColumn]="col.field"
      [class.hidden]="col.field === 'sold' || col.field === 'rateCount'"
      [class.md:table-cell]="col.field === 'sold' || col.field === 'rateCount'"
      [class.!text-start]="col.field === 'title'"
      >
        {{ col.header }}
        <p-sortIcon [field]="col.field" class="" />
      </th>

      <!-- the buttons column -->
       <th class="hidden md:block !text-center !text-lg lg:!text-2xl !font-[600] !bg-[#e5e4e4]">
        Actions
      </th>
    
    </tr>
  </ng-template>

  <!-- Body -->
  <ng-template #body let-row>
    <tr class="hover:!bg-[#FBEAEA] !text-[#27272A] !text-lg lg:!text-xl  " (click)="showDialog()">
      <td *ngFor="let col of columns()" class="!max-w-[180px] !me-auto"
        [class.hidden]="col.field === 'sold' || col.field === 'rateCount'"
        [class.md:table-cell]="col.field === 'sold' || col.field === 'rateCount'"
        
        
      >
       <span  class="!flex !justify-center !items-center" [class.!justify-start]="col.field === 'title'" [class.font-bold]="col.field === 'title'" >
         {{ col.field === 'title' ? (row[col.field] | slice:0:30) + '...' : row[col.field] }}
       </span>
      </td>
    
      <!-- buttons -->
      <td>
      <div class="hidden md:flex justify-around items-center gap-3">

        <button
          class="bg-[#0063D01A] hover:bg-[#0063D01A] text-[#155DFC] px-4 py-2 rounded-lg cursor-pointer"
         
        >
          Edit
        </button>

        <button
          class="bg-[#FF00001A] hover:bg-[#FF00001A] text-[#DC2626] px-4 py-2 rounded-lg cursor-pointer"
          
        >
          Delete
        </button>

      </div>
    </td>

    </tr>
  </ng-template>

  <!-- Empty -->
  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="columns().length">
        No data found
      </td>
    </tr>
  </ng-template> 


</p-table> 

  <div class="card flex justify-center lg:hidden ">
    
    <p-dialog header="Product Settings" [(visible)]="visible" [modal]="true"
     [breakpoints]="{ '999px': '75vw', '475px': '90vw' }" [style]="{ width: '430px' , backgroumd:'white' , height:'146px' }" 
     [draggable]="false" [resizable]="false">
            <div class="flex justify-around items-center gap-3 mt-6">

              <button
                class="bg-[#0063D01A] hover:bg-[#0063D01A] text-[#155DFC] px-4 py-2 rounded-lg cursor-pointer"
              >
                Edit
              </button>

              <button
                class="bg-[#FF00001A] hover:bg-[#FF00001A] text-[#DC2626] px-4 py-2 rounded-lg cursor-pointer"
              >
                Delete
              </button>

            </div>
    </p-dialog>
</div>
