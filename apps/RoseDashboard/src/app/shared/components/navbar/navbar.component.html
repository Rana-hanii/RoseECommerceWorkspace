<section class=" w-full flex flex-row justify-between items-center ">
     <!-- logo and breadcrumb -->
        <div class="w-4/6 flex items-center justify-between gap-x-2">
                <!-- logo -->
             <div class="w-1/4">
                <img [src]="logoImg()" class="w-[60px] h-[57px]" alt="RoseDashboard-logo">
             </div>
        <!-- breadcrumb -->
             <div class="w-3/4">
                <!-- <app-breadcrumb></app-breadcrumb> -->
             </div>
        </div>
     <!-- user photo and burger button -->
          <div class="2/6 flex justify-between items-center gap-x-3 ">
            <div class="w-2/3 ">
                <img [src]="userImg()" class="w-[40px] h-[40px] rounded-full" alt="admin-account-photo">
            </div>
            <div class="w-1/3 ">
              <div class="card flex justify-end">
                        <p-menu #menu [model]="items" [popup]="true" appendTo="body" 
                        styleClass="!rounded-lg !px-2 !bg-white !border-[1px] !py-2 !gap-2" />
                        <p-button (click)="menu.toggle($event)" icon="pi pi-bars"  styleClass="  [&_.p-button-icon]:!text-[15px] !border-2
                            !bg-[var(--color-secondary)] !text-[var(--color-text-maroon)] !border-[var(--color-text-maroon)]
                            hover:!bg-[var(--color-text-maroon)] hover:!text-[var(--color-secondary)] !rounded-lg !py-2 !px-2" />
                </div>
            </div>
         </div>
</section>
